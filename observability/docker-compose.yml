# Auvon.ai observability stack: Prometheus + Grafana (+ Jaeger for traces).
#
#   cd observability
#   docker compose up -d
#
#   Grafana     http://localhost:3000   (no login, opens the Auvon dashboard)
#   Prometheus  http://localhost:9090   (Status -> Targets shows the live app UP/DOWN)
#   Jaeger      http://localhost:16686  (traces, only from a backend run locally, see README note below)
#
# By default Prometheus scrapes the LIVE Azure app (prometheus.live.yml).
# To scrape a backend on your own machine instead:
#   PowerShell:  $env:PROM_CONFIG="prometheus.yml"; docker compose up -d
#
# Traces: the Azure app cannot reach Jaeger on your laptop. To show traces, run the
# backend locally with  OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318/v1/traces

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./${PROM_CONFIG:-prometheus.live.yml}:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/auvon-backend.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
    restart: unless-stopped
