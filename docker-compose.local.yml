version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: auvon-local-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: auvon_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: auvon-local-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
